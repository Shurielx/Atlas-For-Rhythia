# A tag v0.y.z builds Atlas on Windows and makes a DRAFT release with the installer, its update
# signature and latest.json. Nothing reaches players until Shuriel publishes the draft on GitHub:
# installed Atlases read latest.json of the newest published release only (updates.rs).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater key (contents of atlas-for-rhythia.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if it has none)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Atlas for Rhythia ${{ github.ref_name }}
          releaseBody: See the changes below. Atlas offers this update by itself once the release is published.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
